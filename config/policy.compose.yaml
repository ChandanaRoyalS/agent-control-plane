# The policy the composed stack runs under — permissive by design.
#
# `config/policy.yaml` is the illustrative example: a narrow deny in front of
# scoped allows, showing the shape a real policy takes. This file is different
# on purpose. The compose stack exists to prove the whole path works end to end,
# and the smoke test (scripts/compose_smoke.py) authenticates against the
# composed Keycloak and expects to see every tool the upstreams expose.
#
# The rule below is an unconditional allow: no `subjects`, `actors`, or `tools`,
# which the evaluator treats as "matches anything" (an unset field is not a
# constraint). That is deliberate. A Keycloak `sub` is a generated UUID, not a
# username, so a subject-scoped rule could not name the smoke user without
# pinning that UUID into the repo; the compose stack only needs "an
# authenticated caller sees the whole catalogue", which this expresses directly.
# Authentication is still required — filtering runs after the middleware, so an
# unauthenticated request is still refused (the smoke test checks that too).
#
# Keeping this separate from policy.yaml means the example stays realistic while
# the smoke test gets a full catalogue — the same split already used for
# upstreams.yaml vs upstreams.compose.yaml.

rules:
  # Task 55's demo, and the reason it sits *above* the broad allow: first match
  # wins (ADR 0026), so a narrow `require_approval` in front of a broad `allow`
  # is how an operator expresses "everything is fine except this one thing".
  #
  # `mock-a__create_ticket` is the destructive-ish tool in the mock fleet, so it
  # is the one that stops and waits for a person. **The underscore is not a
  # typo and the separator is not one either**: the qualified name is
  # `<upstream>__<tool>`, and the tool's own name keeps whatever spelling the
  # upstream gave it. `mock-a__create-ticket` names nothing, and a policy rule
  # naming nothing does not fail — it simply never matches, and the broad
  # allow below decides instead. tests/integration/test_compose_config.py
  # exists because that mistake shipped once. The tool stays *visible* in
  # `tools/list` — a gated tool must be, because the agent naming it is what
  # starts the approval — which is also why the smoke test still counts six.
  #
  # To drive it once the stack is up:
  #
  #   # 1. the agent asks, and is told to wait
  #   curl -s localhost:8080/mcp -H 'authorization: Bearer <agent token>' ... \
  #     -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{...}}'
  #     -> {"result":{"resultType":"input_required","requestState":"<token>"}}
  #
  #   # 2. a person, on the other port, sees the actual call
  #   curl -s localhost:9090/approvals -H 'authorization: Bearer dev-only-operator-token'
  #
  #   # 3. and answers it
  #   curl -s -XPOST localhost:9090/approvals/<token> \
  #     -H 'authorization: Bearer dev-only-operator-token' \
  #     -d '{"approved":true,"reason":"checked with the data team"}'
  #
  #   # 4. the agent retries with the same requestState and the call runs
  #
  # Two ports, two credentials, two participants — which is the whole control.
  - name: approve-ticket-creation
    effect: require_approval
    tools: [mock-a__create_ticket]

  - name: allow-any-authenticated-caller
    effect: allow
