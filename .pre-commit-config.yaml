# Run: uv run pre-commit install
# These are the same checks CI runs, so a clean commit is a green build.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key        # secrets hygiene, cheaply
      # Windows-hosted downloads arrive marked executable; catch it loudly
      # if it ever survives core.fileMode=false (a fresh clone, another machine).
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # ruff from the *project* environment, for the same reason as mypy below:
  # ruff-pre-commit pins its own version, which drifts from the one uv
  # resolves, and two rulesets disagreeing means the hook rejects what CI
  # accepts. One ruff, one ruleset.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (project environment)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format (project environment)
        entry: .venv/bin/ruff format
        language: system
        types: [python]

  # mypy runs from the *project* environment, not an isolated one.
  # The mirrors-mypy hook builds its own venv containing only whatever is
  # listed in additional_dependencies, so it cannot see httpx, starlette,
  # anyio or pytest and reports import errors that CI does not. Keeping a
  # second hand-maintained copy of the dependency list is the alternative,
  # and it drifts the first time someone adds a package. This runs the exact
  # command CI runs, against the exact environment CI uses.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
