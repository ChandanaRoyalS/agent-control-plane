# Upstream MCP servers the gateway brokers for.
#
# Names must be lowercase alphanumerics with single hyphens, at most 24
# characters, and unique — tool names are qualified as `<name>__<tool>`
# (ADR 0003), so an ambiguous name makes routing ambiguous.
#
# No secrets here. Credentials are read from the secrets directory
# (/run/secrets by default), the way container runtimes mount them.

upstreams:
  - name: mock-a
    url: http://127.0.0.1:9101/mcp

  - name: mock-b
    url: http://127.0.0.1:9102/mcp
    # Per-upstream timeouts. Connect is deliberately much shorter than read:
    # an unreachable host should fail in milliseconds, while a legitimate tool
    # call may take tens of seconds.
    connect_timeout: 3.0
    read_timeout: 30.0

# Retrying is deliberately conservative. `tools/list` is always retried — it is
# a read. Tool *calls* are retried only for tools named here, because a timeout
# means the gateway got no answer, not that nothing happened: a retried
# `create_ticket` may file a second ticket with nobody able to tell.
#
# Only read-only tools belong in `idempotent_tools`.
#
#   - name: mock-a
#     url: http://127.0.0.1:9101/mcp
#     idempotent_tools: ["read_document", "search"]   # NOT create_ticket
#     max_attempts: 3
#     initial_backoff: 0.1
#     max_backoff: 5.0

# Circuit breaker and bulkhead (ADR 0006).
#
# `failure_threshold` consecutive failures open the circuit, after which calls
# are refused immediately instead of each one waiting out a full timeout. Once
# `reset_timeout` has passed, `half_open_max_calls` trial calls are let through:
# one success closes the circuit, one failure re-opens it. Failures are counted
# per *attempt*, so a retried call contributes more than one.
#
# Only timeouts and unreachability count. An upstream that answers — even to
# reject the request — is alive, and opening the circuit on that would let an
# agent sending bad arguments withdraw a healthy upstream for everybody.
#
# `max_concurrency` is the bulkhead: in-flight calls allowed to this upstream
# before further calls are refused rather than queued. It must not exceed
# `max_connections`, so the bulkhead refuses before the connection pool starts
# queueing. Lower it for an upstream that is slow or that you do not trust to
# stay responsive.
#
#   - name: mock-b
#     url: http://127.0.0.1:9102/mcp
#     failure_threshold: 5
#     reset_timeout: 30.0
#     half_open_max_calls: 1
#     max_concurrency: 20
#     max_connections: 20
