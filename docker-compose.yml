# A clone to a running, traced, drift-monitored gateway in one command.
#
#   docker compose up -d --wait
#   curl -s localhost:9090/readyz  | jq
#   curl -s localhost:9090/schemas | jq
#   open http://localhost:16686        # Jaeger
#   docker compose down
#
# `--wait` is doing real work here rather than being decoration: it blocks until
# every service reports *healthy*, so the first request after it returns is not
# racing a collector that has not bound its port yet. Without it, "no spans
# appeared" has two possible causes instead of one.
#
# Everything the gateway needs to find its dependencies is set here rather than
# baked into the image. The image is the artifact; where it points is
# deployment, and an image that only works in one topology is not an artifact.

name: acp

services:
  # -------------------------------------------------------------------------
  # The gateway
  # -------------------------------------------------------------------------
  gateway:
    build:
      context: .
      target: runtime
      # WITH_MOCKS is left at its default of false, so the mock upstream fleet
      # is not present in this image at all — see the Dockerfile.
    image: acp/gateway:dev
    container_name: acp-gateway
    restart: unless-stopped
    # A demo-ordering convenience, and explicitly *not* how the gateway
    # decides whether it can serve. It starts perfectly well with zero
    # upstreams — `gateway_from_configs([])` is a supported configuration — and
    # its readiness comes from the health prober (ADR 0011), which withdraws an
    # upstream's tools when it fails and restores them when it recovers.
    # `docs/demo/health-withdrawal.txt` is that happening with no restart.
    #
    # What this buys is determinism for `--wait`: the smoke test runs the
    # instant compose returns, and without ordering it would race a gateway
    # whose first probe round has not finished. A real deployment has no
    # equivalent line, because there is nothing to race.
    depends_on:
      mock-a:
        condition: service_healthy
      keycloak-ready:
        condition: service_completed_successfully
      mock-b:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      # 0.0.0.0 inside a container, and only inside a container. The default is
      # loopback precisely so that a gateway bound to every interface is a
      # decision somebody made rather than one they inherited — and here it is
      # made, in the one place where loopback would mean "reachable by nothing".
      ACP_HOST: "0.0.0.0"
      ACP_ADMIN_HOST: "0.0.0.0"
      ACP_PORT: "8080"
      ACP_ADMIN_PORT: "9090"
      ACP_LOG_FORMAT: json
      # DNS-rebinding protection rejects any Host it has not been told about,
      # and a browser or client reaching this on :8080 sends the port too — the
      # bug found in task 9. JSON because pydantic-settings parses list-typed
      # settings as JSON, not as comma-separated text.
      ACP_ALLOWED_HOSTS: '["localhost","127.0.0.1","gateway","acp-gateway"]'
      ACP_UPSTREAMS_FILE: /app/config/upstreams.compose.yaml
      ACP_POLICY_FILE: /app/config/policy.compose.yaml
      ACP_SCHEMA_BASELINE_FILE: /app/config/schema-baseline.json
      # -- human-in-the-loop approvals (task 55) ---------------------------
      #
      # `policy.compose.yaml` holds `mock-a__create_ticket` for a person. This
      # is what makes answering possible: with no operator credential the
      # approval routes are not mounted at all, so every gated call would wait
      # out its TTL and be refused. The gateway says so at startup
      # (`approval.no_operator_channel`) rather than failing silently.
      #
      # The channel lives on the ADMIN listener (`:9090`), never on the MCP one
      # (`:8080`). That is the control, not the plumbing: an agent cannot
      # approve its own call because it cannot address the thing that approves
      # calls. See ADR 0049.
      #
      # Committed in the clear for the same reason the Keycloak client secret
      # above is: this stack is a demonstration on loopback. A real deployment
      # puts this in the secret store like any other production credential —
      # it is the one write on a listener that is otherwise read-only.
      ACP_APPROVAL_OPERATOR_TOKEN: dev-only-operator-token
      # Five minutes is the default. Named here because it is the default-deny
      # (ADR 0048) wearing the clothes of a timeout: raising it widens the
      # window in which one person's yes can still be spent.
      ACP_APPROVAL_TTL_SECONDS: "300"
      ACP_APPROVAL_MAX_PENDING: "256"
      # -- the tamper-evident audit chain (tasks 56, 57) -------------------
      #
      # Presence of the path is what enables it; there is deliberately no
      # default, because an evidentiary artifact appearing in somebody's working
      # directory the first time they run the gateway is one that gets
      # gitignored, then forgotten.
      #
      # /app/audit is a HOST-MOUNTED directory, not a named volume, so
      # `acp audit verify` can be run by a person rather than through
      # `docker exec`. A verifier that is awkward to run is one that runs after
      # an incident instead of before.
      ACP_AUDIT_FILE: /app/audit/audit.jsonl
      # Fail closed: a call this gateway cannot record does not happen. An audit
      # log that stops recording while the gateway keeps serving is worse than
      # none, because the record then asserts by omission that nothing happened
      # during the window somebody will eventually ask about.
      ACP_AUDIT_REQUIRED: "true"
      # Switchable, so ADR 0050 §8's declared cost can be measured rather than
      # asserted (task 60). `make load` runs with it on; `make load-nofsync`
      # runs the identical mix with it off, and the difference is what
      # durability costs on this machine's disk.
      #
      # Defaulted to true, so the honest setting is the one you get without
      # asking for it. A record buffered in the kernel when the machine loses
      # power describes a call that really happened, and that is precisely the
      # crash-adjacent window an investigation cares about.
      ACP_AUDIT_FSYNC: "${ACP_AUDIT_FSYNC:-true}"
      # -- budgets, caching and the firewall -------------------------------
      #
      # All four of these files were already mounted by `./config:/app/config:ro`
      # below. What was missing was anything pointing at them, so four merged
      # features did nothing in the only deployment anybody actually runs.
      ACP_COST_FILE: /app/config/costs.yaml
      ACP_CACHE_FILE: /app/config/cache.yaml
      # -- and the controls that spend against that cost table ---------------
      #
      # Without these two, ACP_COST_FILE above is parsed at every start and
      # never read: `_charge` returns immediately when there is no limiter and
      # no quota. Tasks 39, 41 and 42, inert in the only deployment anybody
      # runs, until task 62's configuration register printed them as OFF.
      #
      # NOT the shipped defaults (burst 60, 1/second). Those are right for a
      # real deployment and would make `make load` report ninety percent
      # THROTTLED — a load test measuring the limiter rather than the gateway.
      # These bind for an abusive caller and not for the load mix: one
      # principal there offers about 28 calls/second.
      ACP_RATE_LIMIT_ENABLED: "${ACP_RATE_LIMIT_ENABLED:-true}"
      ACP_RATE_LIMIT_CAPACITY: "${ACP_RATE_LIMIT_CAPACITY:-500}"
      ACP_RATE_LIMIT_REFILL_PER_SECOND: "${ACP_RATE_LIMIT_REFILL_PER_SECOND:-200}"
      # In the same units the cost table weights, so a summarise costs ten of
      # these and a search three. The load mix averages ~2.8 per call.
      ACP_QUOTA_ENABLED: "${ACP_QUOTA_ENABLED:-true}"
      ACP_QUOTA_LIMIT: "${ACP_QUOTA_LIMIT:-500000}"
      # Interpolated so a demo can make either bind for one run:
      #   ACP_RATE_LIMIT_CAPACITY=5 ACP_RATE_LIMIT_REFILL_PER_SECOND=1 \
      #       docker compose up -d --wait gateway
      # Two more content blocks than the upstream sent, which is a visible
      # change to the wire and therefore a deliberate one (ADR 0037). On here
      # because the firewall below is on: with framing enabled an unfenced block
      # is by construction the gateway speaking, which is what lets a refusal
      # notice be told apart from a document impersonating one.
      ACP_PROVENANCE_FRAMING_ENABLED: "${ACP_PROVENANCE_FRAMING_ENABLED:-true}"
      # `report` screens every result, logs every finding, and changes nothing
      # the caller receives — where ADR 0038 says a deployment starts. It still
      # evaluates the enforcement bar and logs a result it *would* have withheld
      # as `would_refuse`, so the stack shows what enforcement would cost before
      # anybody pays it.
      #
      # Interpolated, so the attack demo can raise it for one run:
      #     ACP_FIREWALL_MODE=enforce docker compose up -d --wait gateway
      ACP_FIREWALL_MODE: "${ACP_FIREWALL_MODE:-report}"
      # Without this the exfiltration detector reports every image and can
      # withhold none of them, because it cannot tell a leak from a logo. Two
      # invented internal hosts: the mock fleet returns no URLs at all, so this
      # documents the shape rather than filtering anything today.
      ACP_FIREWALL_ALLOWED_HOSTS: '["docs.internal","cdn.internal"]'
      ACP_HEALTH_PROBE_INTERVAL: "5.0"
      # Interpolated so probing can be turned off from the shell without
      # editing this file. Worth having beyond the demo: with the prober
      # running, it invalidates and refetches every catalogue every five
      # seconds, so the cache (task 19) is permanently warm and *no*
      # `tools/list` request ever reaches an upstream. That is correct, and
      # it means the request path's upstream fan-out is invisible until
      # something lets the cache actually expire.
      ACP_HEALTH_PROBING_ENABLED: "${ACP_HEALTH_PROBING_ENABLED:-true}"
      # -- identity, against the real thing (task 26) ----------------------
      #
      # The issuer is `keycloak:8080` and not `localhost:8081` because the
      # gateway resolves it from inside this network, and because `iss` is
      # compared as an exact string — one identity, one spelling, everywhere.
      ACP_AUTH_ISSUER: http://keycloak:8080/realms/acp
      # Audience and resource identifier are the same string on purpose: the
      # gateway publishes it under RFC 9728, a client asks for it as RFC 8707's
      # `resource`, and Keycloak's audience mapper writes it into `aud`. It is
      # `localhost:8080` because that is where a *client* reaches the gateway,
      # which is a different question from where the gateway reaches Keycloak.
      ACP_AUTH_AUDIENCE: http://localhost:8080/mcp
      ACP_AUTH_RESOURCE: http://localhost:8080/mcp
      # The assertion, not a switch. This deployment has an identity provider,
      # so a gateway here that resolved every request to `anonymous` is a
      # deployment that has failed, not one running in a different mode.
      ACP_AUTH_REQUIRED: "true"
      # And the price of a demo identity provider that speaks plain HTTP.
      # Narrow, named, and logged at every start — ADR 0018.
      ACP_AUTH_INSECURE_ISSUER_HOSTS: '["keycloak"]'
      # -- token exchange (task 27) ----------------------------------------
      #
      # Who the gateway *is* when it asks the authorization server for a
      # credential. Distinct from ACP_AUTH_AUDIENCE above, which is what the
      # gateway is *called* by tokens arriving at it — resource server there,
      # OAuth client here, and conflating the two is the easy mistake.
      #
      # Setting both of these is what turns exchange on: there is no boolean,
      # because a credential is not something you can forget to supply and still
      # have the feature appear to work. Once on, every upstream must declare an
      # `audience` or the gateway refuses to start.
      ACP_AUTH_CLIENT_ID: acp-gateway
      # In git, and a fixture rather than a secret — see config/keycloak/README.
      # A real deployment mounts this at /run/secrets/auth_client_secret and
      # never puts it in the environment, because a process's environment is
      # readable by anything that can see /proc.
      ACP_AUTH_CLIENT_SECRET: dev-only-not-a-secret-either
      # OpenTelemetry's own variables, not ACP_ ones. `jaeger` is the service
      # name below; on the host this same gateway finds Jaeger on localhost
      # with no configuration at all, because 4318 is already the OTLP/HTTP
      # default.
      OTEL_SERVICE_NAME: agent-control-plane
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-otlp}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      # Read-only, and that is a security property rather than tidiness. The
      # schema baseline is the record a drift alert is measured against
      # (ADR 0013), so a gateway that can write to it is a gateway that can
      # silence its own alarm. Nothing in the runtime path writes here;
      # `acp schemas capture` is a human act performed on the host and reviewed
      # as a diff.
      - ./config:/app/config:ro
      #
      # Writable, and the only writable mount this container has. The chain goes
      # here; the CHECKPOINT that anchors it goes in `config/` above, which is
      # read-only — so the gateway can write its own log and cannot write the
      # thing that proves it has not rewritten that log. ADR 0050 argues the
      # anchor is worth exactly the distance between it and the writer, and this
      # is that distance expressed as a mount option rather than as discipline.
      - ./audit:/app/audit
    ports:
      - "8080:8080"
      - "9090:9090"

  # -------------------------------------------------------------------------
  # Mock upstreams — ADR 0004
  # -------------------------------------------------------------------------
  #
  # Same image, built with WITH_MOCKS=true so the fleet is actually present.
  # A separate tag, so it is impossible to deploy the mock-bearing build by
  # reaching for `acp/gateway:dev` and getting the wrong one.
  mock-a: &mock
    build:
      context: .
      target: runtime
      args:
        WITH_MOCKS: "true"
    image: acp/mocks:dev
    container_name: acp-mock-a
    restart: unless-stopped
    entrypoint: ["uvicorn"]
    command: ["acp.mocks.mock_a:app", "--host", "0.0.0.0", "--port", "9101"]
    # Overrides the image's own healthcheck, which probes the gateway's admin
    # listener — a port these containers do not serve.
    #
    # A TCP connect, and worth being precise about what that does and does not
    # prove: that the listener is bound, not that the protocol works. MCP has
    # no health method and inventing one for the mocks would test the invention.
    # Proving the protocol works is the gateway's health prober's job (task 18),
    # which is the layer that should be doing it — so this check stays honest
    # about being a liveness check and leaves readiness to the thing that can
    # actually judge it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 9101), 2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "9101:9101"

  mock-b:
    <<: *mock
    container_name: acp-mock-b
    command: ["acp.mocks.mock_b:app", "--host", "0.0.0.0", "--port", "9102"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 9102), 2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "9102:9102"


  # -------------------------------------------------------------------------
  # The identity provider — task 26
  # -------------------------------------------------------------------------
  #
  # Everything in tasks 22 to 24 was tested against fakes written in this
  # repository, and a mock that agrees with your client proves only that you
  # wrote both. This is the first thing in the stack that can disagree with us.
  #
  # `start-dev` and not `start`: this is a demo realm on a laptop, HTTP-only,
  # with an in-container database. Running it in production mode would mean
  # provisioning Postgres and TLS to prove a point nobody is asking about.
  keycloak:
    # Pinned, like Jaeger and for the same reason: an identity provider that
    # silently changes how it issues tokens between runs turns "the gateway
    # rejects my token" into a question with two possible causes.
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: acp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # The whole reason this file names `keycloak:8080` everywhere rather than
      # `localhost`. An issuer is a public identity compared as an exact string
      # (RFC 8414 §2, ADR 0016), so it has to be one string from every vantage
      # point — and the gateway's vantage point is inside this network, where
      # `localhost` means the gateway itself. Setting the hostname explicitly
      # fixes what Keycloak stamps into `iss` regardless of which host a request
      # arrived on. See ADR 0018.
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Dev credentials for the admin console, in a file that is in git. They
      # unlock a realm containing two invented users and no data.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      # Read-only. Keycloak imports the realm and never needs to write here, and
      # a config source an application can rewrite is a config source that tells
      # you nothing about what it was configured with.
      - ./config/keycloak:/opt/keycloak/data/import:ro
      #
      # There is deliberately no volume for the database. Dev mode keeps H2 under
      # /opt/keycloak/data/h2 — a directory the image does not contain, so a named
      # volume mounted there is created by Docker as root:root, and Keycloak, which
      # runs as uid 1000, dies on boot with AccessDeniedException. That is what the
      # first CI run of this stack found, after two minutes of JDBC retries.
      #
      # Persisting it was worth little anyway. The committed realm is the source of
      # truth, and a surviving database means console edits diverge silently from
      # the file in git. Without one, every recreated container re-imports the
      # realm and there is one fewer piece of state to explain. A container that is
      # merely restarted still keeps its database, which is why `make idp-reset`
      # recreates rather than restarts.
    ports:
      # The admin console: http://localhost:8081 (admin / admin).
      - "8081:8080"

  # A one-shot readiness gate, deliberately built from *our* image.
  #
  # The gateway runs OIDC discovery at startup, before it binds a port, because
  # an issuer whose metadata contradicts its own identity should stop a
  # deployment rather than surprise the first request. That makes "Keycloak is
  # answering yet" a hard ordering dependency rather than a nicety.
  #
  # The usual way to express that is a healthcheck on the Keycloak container,
  # which means writing a probe out of whatever binaries that image happens to
  # ship — no curl, no wget, and a shell one-liner that breaks when the base
  # image changes. Polling from a container we control needs nothing from
  # theirs, and the failure message is one we wrote.
  keycloak-ready:
    build:
      context: .
      target: runtime
    image: acp/gateway:dev
    container_name: acp-keycloak-ready
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["python", "-c"]
    command:
      - |
        import sys, time, urllib.error, urllib.request
        url = "http://keycloak:8080/realms/acp/.well-known/openid-configuration"
        deadline = time.monotonic() + 180
        last = "no attempt"
        while time.monotonic() < deadline:
            try:
                with urllib.request.urlopen(url, timeout=3) as response:
                    if response.status == 200:
                        print("keycloak: realm acp is serving metadata", flush=True)
                        sys.exit(0)
                    last = f"HTTP {response.status}"
            except (urllib.error.URLError, OSError) as exc:
                last = type(exc).__name__
            print(f"keycloak: waiting ({last})", flush=True)
            time.sleep(2)
        sys.exit(
            f"keycloak did not serve {url} within 180s; last attempt: {last}. "
            "`docker compose logs keycloak` is where the reason is."
        )

  # -------------------------------------------------------------------------
  # Trace backend
  # -------------------------------------------------------------------------
  jaeger:
    # Pinned rather than `latest`: a trace backend that silently changes its
    # OTLP behaviour between runs turns "no spans appeared" into a question
    # with two possible causes instead of one.
    image: jaegertracing/all-in-one:1.76.0
    container_name: acp-jaeger
    restart: unless-stopped
    ports:
      # The UI. This is the port you actually open.
      - "16686:16686"
      # OTLP receivers — HTTP on 4318, gRPC on 4317. The gateway uses HTTP:
      # one fewer dependency, and it survives proxies that gRPC does not.
      # Enabled by default from Jaeger 1.35 onward; no COLLECTOR_OTLP_ENABLED
      # needed on this version.
      - "4318:4318"
      - "4317:4317"
    healthcheck:
      # 14269 is the admin port, which answers before the UI does. Without a
      # healthcheck, `compose up -d` returns while the collector is still
      # binding, and the first few spans are dropped by a backend that is not
      # listening yet — which reads exactly like instrumentation that does not
      # work.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
