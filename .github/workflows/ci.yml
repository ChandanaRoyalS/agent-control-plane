name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — saves CI minutes and your patience.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # fail if the lockfile is stale rather than silently resolving

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  compat:
    name: oldest supported python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.12"` is a promise, and until this job existed it
    # was a promise nothing tested — every other job runs 3.14. A compatibility
    # claim with no evidence behind it is the same class of thing as a comment
    # asserting an invariant.
    #
    # A separate job rather than a matrix on `quality`, deliberately: a matrix
    # renames the check to "lint · types · tests (3.14)", and branch protection
    # names required checks by string. Adding a job is additive; renaming one
    # blocks every open pull request until somebody notices.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the floor version
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --python 3.12

      - name: Test
        # Tests only. Lint and types are pinned to the floor already —
        # `target-version = "py312"` and `python_version = "3.12"` — so running
        # them again on the same target would check the same thing twice.
        run: uv run pytest

  image:
    name: image · compose · smoke
    runs-on: ubuntu-latest
    # Raised from 15 in task 26: the stack now boots a Keycloak, imports a realm
    # and waits for it to serve metadata before the gateway will even bind a
    # port. That is a minute of wall clock nobody can optimise away, and it buys
    # the only assertions in this repository made against an authorization
    # server it did not write.
    timeout-minutes: 20
    # Runs alongside `quality` rather than after it. They fail for unrelated
    # reasons — a type error and a broken Dockerfile are different problems —
    # and chaining them would mean a packaging bug hides behind a lint failure
    # until somebody fixes the lint.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate the compose file
        # Before building anything. A typo in compose is a ten-second failure
        # here and a ten-minute one after two images have been built.
        run: docker compose config --quiet

      - name: Build the images
        # `--pull` so a stale cached base image cannot make a broken build look
        # fine, and both targets because the mock build takes a different path
        # through the Dockerfile than the gateway build does.
        run: docker compose build --pull

      - name: Confirm the gateway image contains no mock upstreams
        # The claim the WITH_MOCKS argument makes, checked rather than trusted.
        # Two servers with deliberately controllable failure modes have no
        # business inside an artifact whose purpose is to be a security
        # boundary, and "we removed it" is the kind of statement that quietly
        # stops being true.
        run: |
          if docker run --rm --entrypoint python acp/gateway:dev \
               -c "import acp.mocks" 2>/dev/null; then
            echo "::error::acp.mocks is importable in the gateway image"
            exit 1
          fi
          echo "acp.mocks is absent, as intended"

      - name: Confirm the gateway does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id acp/gateway:dev -u)
          echo "container uid: $uid"
          [ "$uid" = "10001" ]

      - name: Bring the stack up
        # `--wait gateway` rather than the whole project. Naming the one service
        # that matters still starts everything it depends on — including waiting
        # for the one-shot readiness gate to *complete* — while keeping a
        # container that deliberately exits out of the set compose is asked to
        # see running.
        run: docker compose up -d --wait gateway

      - name: Keycloak's log if it did not come up
        if: failure()
        # Separate from the catch-all below and printed first, because when this
        # step's predecessor fails the reason is almost always in here, and
        # scrolling past four other containers to find it costs minutes.
        run: docker compose logs --no-color keycloak

      - name: Smoke test
        run: python scripts/compose_smoke.py

      - name: Identity smoke test
        # A separate step, so "the stack works" and "the stack authenticates"
        # fail with different names in the checks list. They are different
        # problems and the fix for one is nowhere near the fix for the other.
        run: python scripts/identity_smoke.py

      - name: Logs on failure
        if: failure()
        # Keycloak included: when the identity smoke fails, the reason is
        # usually in the gateway's startup lines (which issuer it discovered,
        # which key set it fetched) or in Keycloak's import log.
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
