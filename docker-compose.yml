# A clone to a running, traced, drift-monitored gateway in one command.
#
#   docker compose up -d --wait
#   curl -s localhost:9090/readyz  | jq
#   curl -s localhost:9090/schemas | jq
#   open http://localhost:16686        # Jaeger
#   docker compose down
#
# `--wait` is doing real work here rather than being decoration: it blocks until
# every service reports *healthy*, so the first request after it returns is not
# racing a collector that has not bound its port yet. Without it, "no spans
# appeared" has two possible causes instead of one.
#
# Everything the gateway needs to find its dependencies is set here rather than
# baked into the image. The image is the artifact; where it points is
# deployment, and an image that only works in one topology is not an artifact.

name: acp

services:
  # -------------------------------------------------------------------------
  # The gateway
  # -------------------------------------------------------------------------
  gateway:
    build:
      context: .
      target: runtime
      # WITH_MOCKS is left at its default of false, so the mock upstream fleet
      # is not present in this image at all — see the Dockerfile.
    image: acp/gateway:dev
    container_name: acp-gateway
    restart: unless-stopped
    # A demo-ordering convenience, and explicitly *not* how the gateway
    # decides whether it can serve. It starts perfectly well with zero
    # upstreams — `gateway_from_configs([])` is a supported configuration — and
    # its readiness comes from the health prober (ADR 0011), which withdraws an
    # upstream's tools when it fails and restores them when it recovers.
    # `docs/demo/health-withdrawal.txt` is that happening with no restart.
    #
    # What this buys is determinism for `--wait`: the smoke test runs the
    # instant compose returns, and without ordering it would race a gateway
    # whose first probe round has not finished. A real deployment has no
    # equivalent line, because there is nothing to race.
    depends_on:
      mock-a:
        condition: service_healthy
      mock-b:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      # 0.0.0.0 inside a container, and only inside a container. The default is
      # loopback precisely so that a gateway bound to every interface is a
      # decision somebody made rather than one they inherited — and here it is
      # made, in the one place where loopback would mean "reachable by nothing".
      ACP_HOST: "0.0.0.0"
      ACP_ADMIN_HOST: "0.0.0.0"
      ACP_PORT: "8080"
      ACP_ADMIN_PORT: "9090"
      ACP_LOG_FORMAT: json
      # DNS-rebinding protection rejects any Host it has not been told about,
      # and a browser or client reaching this on :8080 sends the port too — the
      # bug found in task 9. JSON because pydantic-settings parses list-typed
      # settings as JSON, not as comma-separated text.
      ACP_ALLOWED_HOSTS: '["localhost","127.0.0.1","gateway","acp-gateway"]'
      ACP_UPSTREAMS_FILE: /app/config/upstreams.compose.yaml
      ACP_SCHEMA_BASELINE_FILE: /app/config/schema-baseline.json
      ACP_HEALTH_PROBE_INTERVAL: "5.0"
      # Interpolated so probing can be turned off from the shell without
      # editing this file. Worth having beyond the demo: with the prober
      # running, it invalidates and refetches every catalogue every five
      # seconds, so the cache (task 19) is permanently warm and *no*
      # `tools/list` request ever reaches an upstream. That is correct, and
      # it means the request path's upstream fan-out is invisible until
      # something lets the cache actually expire.
      ACP_HEALTH_PROBING_ENABLED: "${ACP_HEALTH_PROBING_ENABLED:-true}"
      # OpenTelemetry's own variables, not ACP_ ones. `jaeger` is the service
      # name below; on the host this same gateway finds Jaeger on localhost
      # with no configuration at all, because 4318 is already the OTLP/HTTP
      # default.
      OTEL_SERVICE_NAME: agent-control-plane
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      # Read-only, and that is a security property rather than tidiness. The
      # schema baseline is the record a drift alert is measured against
      # (ADR 0013), so a gateway that can write to it is a gateway that can
      # silence its own alarm. Nothing in the runtime path writes here;
      # `acp schemas capture` is a human act performed on the host and reviewed
      # as a diff.
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
      - "9090:9090"

  # -------------------------------------------------------------------------
  # Mock upstreams — ADR 0004
  # -------------------------------------------------------------------------
  #
  # Same image, built with WITH_MOCKS=true so the fleet is actually present.
  # A separate tag, so it is impossible to deploy the mock-bearing build by
  # reaching for `acp/gateway:dev` and getting the wrong one.
  mock-a: &mock
    build:
      context: .
      target: runtime
      args:
        WITH_MOCKS: "true"
    image: acp/mocks:dev
    container_name: acp-mock-a
    restart: unless-stopped
    entrypoint: ["uvicorn"]
    command: ["acp.mocks.mock_a:app", "--host", "0.0.0.0", "--port", "9101"]
    # Overrides the image's own healthcheck, which probes the gateway's admin
    # listener — a port these containers do not serve.
    #
    # A TCP connect, and worth being precise about what that does and does not
    # prove: that the listener is bound, not that the protocol works. MCP has
    # no health method and inventing one for the mocks would test the invention.
    # Proving the protocol works is the gateway's health prober's job (task 18),
    # which is the layer that should be doing it — so this check stays honest
    # about being a liveness check and leaves readiness to the thing that can
    # actually judge it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 9101), 2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "9101:9101"

  mock-b:
    <<: *mock
    container_name: acp-mock-b
    command: ["acp.mocks.mock_b:app", "--host", "0.0.0.0", "--port", "9102"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 9102), 2).close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "9102:9102"

  # -------------------------------------------------------------------------
  # Trace backend
  # -------------------------------------------------------------------------
  jaeger:
    # Pinned rather than `latest`: a trace backend that silently changes its
    # OTLP behaviour between runs turns "no spans appeared" into a question
    # with two possible causes instead of one.
    image: jaegertracing/all-in-one:1.76.0
    container_name: acp-jaeger
    restart: unless-stopped
    ports:
      # The UI. This is the port you actually open.
      - "16686:16686"
      # OTLP receivers — HTTP on 4318, gRPC on 4317. The gateway uses HTTP:
      # one fewer dependency, and it survives proxies that gRPC does not.
      # Enabled by default from Jaeger 1.35 onward; no COLLECTOR_OTLP_ENABLED
      # needed on this version.
      - "4318:4318"
      - "4317:4317"
    healthcheck:
      # 14269 is the admin port, which answers before the UI does. Without a
      # healthcheck, `compose up -d` returns while the collector is still
      # binding, and the first few spans are dropped by a backend that is not
      # listening yet — which reads exactly like instrumentation that does not
      # work.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
