name: Release

# A tag is the one event in this repository that produces an artifact
# somebody else runs, so it is the one place where "the checks passed on some
# commit" is not good enough. Everything here re-verifies the tagged commit
# itself, and every assertion runs BEFORE anything is pushed.
#
# A separate workflow from `ci.yml` on purpose. CI runs on every push and pull
# request and must stay fast; this runs a handful of times a year and may take
# as long as it needs. Merging them would mean adding `if: startsWith(github.ref,
# 'refs/tags/')` to half the steps of a file everybody reads daily.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the GitHub release
  packages: write # to push to ghcr.io

env:
  UV_FROZEN: "1"
  # IMAGE is set by the first step of the job, not here: `github.repository`
  # keeps the owner's capitalisation (ChandanaRoyalS) and a Docker repository
  # name must be lowercase. The previous owner happened to be all-lowercase,
  # which is why this only failed after the repository moved.

jobs:
  release:
    name: verify · publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Name the image, in lowercase
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image: $image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # One cache per job: they install different sets (the floor Python,
          # the image job's few tools), and parallel jobs sharing one key race
          # to save it.
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      # ------------------------------------------------------------------
      # Refuse before building. A tag is cheap to delete and an image on a
      # public registry is not.
      # ------------------------------------------------------------------

      - name: Refuse a tag that disagrees with the code
        id: version
        # The failure this prevents: `git tag v1.1.0` on a commit whose
        # `acp.__version__` still says 1.0.0, producing an image whose
        # `--version` contradicts the tag it was published under. Nothing else
        # in the pipeline would notice, and the contradiction would surface in
        # somebody else's bug report.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(uv run python -c 'import acp; print(acp.__version__)')"
          echo "tag: $tag"
          echo "code: $code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} disagrees with acp.__version__ (${code})"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "minor=${tag%.*}" >> "$GITHUB_OUTPUT"

      - name: Refuse a release the changelog does not describe
        # Exits 1 when CHANGELOG.md has no section for this version, or has one
        # with an empty body. A release published with empty notes is
        # indistinguishable from one whose notes were lost.
        run: |
          uv run python scripts/release_notes.py \
            --version "${{ steps.version.outputs.version }}" > /tmp/notes.md
          echo "--- notes ---"
          cat /tmp/notes.md

      - name: Refuse a release whose public surface was never accepted
        # The same check the suite runs, repeated here because this is the
        # moment the surface stops being a repository's business and becomes a
        # promise to whoever pulls the image. ADR 0058.
        run: uv run python scripts/capture_surface.py

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Prove the security tests can fail
        # All four run whatever the others do, so one failure does not hide
        # three answers. `rc` is what makes the step fail if any of
        # them did -- `;` alone would report success on the last one.
        run: |
          rc=0
          uv run python scripts/mutate_no_passthrough.py || rc=1
          uv run python scripts/mutate_result_cache.py   || rc=1
          uv run python scripts/mutate_refusal.py        || rc=1
          uv run python scripts/prove_predispatch.py     || rc=1
          exit $rc

      # ------------------------------------------------------------------
      # Build, assert, then push. Never the other way round.
      # ------------------------------------------------------------------

      - name: Set up QEMU
        # arm64 is built and checked under emulation on this amd64 runner, so
        # one job builds, checks and publishes both. The image installs wheels
        # only (nothing compiles), which keeps the emulated build to minutes.
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # One build per platform, each loaded so it can be run. The docker
      # exporter cannot load a manifest list, and buildx attaches a provenance
      # attestation by default -- which turns the build's output into one. Off,
      # so `load: true` produces a single image the checks can run.

      - name: Build the gateway image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          build-args: WITH_MOCKS=false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-amd64

      - name: Build the gateway image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          build-args: WITH_MOCKS=false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-arm64

      - name: Check both images
        # Run on each image about to be pushed, under its own platform:
        # - it is the architecture its tag says;
        # - it contains no mock upstreams. `WITH_MOCKS` is a build argument, and
        #   one with a typo in its name is silently ignored, shipping two servers
        #   with controllable failure modes inside a security boundary;
        # - it does not run as root;
        # - it reports the version it is tagged with: the tag, the code and the
        #   artifact agreeing (the first two were checked before the build).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            ref="${IMAGE}:${VERSION}-${arch}"
            run="docker run --rm --platform linux/${arch}"
            echo "--- ${ref}"

            built=$(docker image inspect --format '{{.Architecture}}' "$ref")
            echo "architecture: $built"
            [ "$built" = "$arch" ] || { echo "::error::${ref} is ${built}"; exit 1; }

            if $run --entrypoint python "$ref" -c "import acp.mocks" 2>/dev/null; then
              echo "::error::acp.mocks is importable in ${ref}"
              exit 1
            fi
            echo "acp.mocks is absent, as intended"

            uid=$($run --entrypoint id "$ref" -u)
            echo "container uid: $uid"
            [ "$uid" = "10001" ] || { echo "::error::${ref} runs as uid ${uid}"; exit 1; }

            reported=$($run --entrypoint python "$ref" -c "import acp; print(acp.__version__)")
            echo "reported: $reported"
            [ "$reported" = "$VERSION" ] || { echo "::error::${ref} reports ${reported}"; exit 1; }
          done

      - name: Log in to ghcr.io
        # Deliberately after every check. A login before them would mean a
        # failed check leaves a session open to a registry for the rest of the
        # job.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        # The two checked images are pushed under per-platform tags, then joined
        # into one manifest list under three tags: the exact version, the minor
        # line, and `latest`. The list points at the images that were checked,
        # not at a rebuild. `latest` is a convenience and a hazard -- it is what
        # somebody gets when they forget to pin -- so the README pins a version
        # everywhere it shows a `docker run`.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          docker push "${IMAGE}:${VERSION}-amd64"
          docker push "${IMAGE}:${VERSION}-arm64"
          for tag in "$VERSION" "$MINOR" latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" \
              "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          done

      - name: Confirm the published tag serves both platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" | tee /tmp/manifest
          grep -q "linux/amd64" /tmp/manifest
          grep -q "linux/arm64" /tmp/manifest

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --verify-tag
