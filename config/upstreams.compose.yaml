# The same two upstreams as `upstreams.yaml`, addressed by service name.
#
# A separate file rather than environment substitution in the original. The
# gateway's config loader validates a real file and names it in any error, and
# a YAML full of `${MOCK_A_URL}` placeholders would be a document that is only
# valid once something else has expanded it — which is exactly the sort of
# thing that fails at 3am with a message about a malformed URL.
#
# `mock-a` and `mock-b` here are Docker Compose service names, resolved by the
# embedded DNS server on the project's network. They are also, deliberately,
# the same *upstream* names as in `upstreams.yaml` — the schema baseline
# (ADR 0013) is keyed by upstream name, so the committed baseline applies
# unchanged whether the gateway is running on the host or in a container. A
# baseline that only held in one of those would be worth very little.

#
# `audience` (task 27) names each upstream to the authorization server. It is
# what the gateway sends as RFC 8693's `audience` when exchanging the caller's
# token, and what the resulting credential carries in `aud` — which is what
# makes a token for mock-a useless against mock-b. The values are Keycloak
# client IDs because Keycloak's exchange names its target that way; the realm
# defines one client per upstream purely to be named here.
#
# Once ACP_AUTH_CLIENT_ID is set, an upstream without an `audience` is a
# startup failure. A gateway that credentials four upstreams and reaches the
# fifth with nothing is worse than one that credentials none, because the hole
# is the only part nobody is watching.

# `resource` is RFC 8707's way of naming the same thing by URI. Both are sent.
# Keycloak accepts `resource` and discards it — measured, not assumed
# (`make probe-resource`, ADR 0020) — so `audience` is what narrows here and
# `resource` is what would narrow on a conformant server. Neither is trusted:
# the credential that comes back is checked against the one that was asked for.

upstreams:
  - name: mock-a
    url: http://mock-a:9101/mcp
    audience: acp-upstream-mock-a
    resource: https://mock-a.internal/mcp

  - name: mock-b
    url: http://mock-b:9102/mcp
    audience: acp-upstream-mock-b
    resource: https://mock-b.internal/mcp
    connect_timeout: 3.0
    read_timeout: 30.0
